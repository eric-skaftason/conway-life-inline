<body>
    <h1>Conway's Game of Life</h1>

    <div class="demo_container">
        <div class="board"></div>
        <div class="controls">
            <button id="play">Play</button>
            <button id="speed">NORMAL</button>
        </div>
    </div>

    <style>
        h1 {
            margin-top: 25px;
            text-align: center;
        }

        body {
            background: black; color: white; font-family: sans-serif;
            width: 100%;
            margin: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .demo_container {
            width: 750px;
        }

        .board {
            display: grid;
            grid-template-rows: repeat(50, 15px);
            grid-template-columns: repeat(50, 15px);
        }

        .row {
            display: inline-block;
        }

        .cell {
            background-color: grey;
            outline: 1px solid black;
        }

        .alive {
            background-color: green;
        }

        .controls {
            display: flex;
            height: 40px;
        }

        button {
            flex: 1;
            box-sizing: border-box;

            background-color: rgb(32, 32, 32);
            color: white;
            border: 1px solid white;
            outline: none;

            cursor: pointer;
        }

        button:hover {
            background-color: rgb(48, 48, 48);
        }

        button:active {
            background-color: rgb(16, 16, 16);
        }

    </style>
    <script>
        // States
        let isRunning = false;

        const SPEEDS = [
            ["VSLOW", 800],    
            ["SLOW", 500],
            ["NORMAL", 250],
            ["FAST", 100],
            ["VFAST", 50]
        ];

        let speed = SPEEDS[2];

        const ROWS = 50, COLS = 50;

        // 0 - off, 1 - on
        const matrix = Array.from({length: ROWS * COLS}, () => ({current: 0, next: null}));

        // Board Setup
        const board = document.querySelector('.board');

        for (let i = 0; i < ROWS * COLS; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');

            cell.addEventListener('click', () => {
                if (cell.classList.contains('alive')) {
                    cell.classList.remove('alive');
                    matrix[i].current = 0;
                } else {
                    cell.classList.add('alive');
                    matrix[i].current = 1;
                }
            });
            board.append(cell);
        }

        const cells = document.querySelectorAll('.cell');

        document.querySelector('#play').addEventListener('click', () => {
            if (!isRunning) {
                run();
                document.querySelector('#play').innerText = 'Pause';
            } else {
                isRunning = false;
                document.querySelector('#play').innerText = 'Play';
            }
        });

        document.querySelector('#speed').addEventListener('click', () => {
            speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];

            document.querySelector('#speed').innerText = speed[0];
        });

        /*
            RULES:

            Any live cell with fewer than two live neighbours dies, as if by underpopulation.
            Any live cell with two or three live neighbours lives on to the next generation.
            Any live cell with more than three live neighbours dies, as if by overpopulation.
            Any dead cell with exactly three live neighbours becomes a live cell, as if by reproduction.
        */

        function indexToRowCol(index) {
            const row = Math.floor(index / COLS);
            const col = index % COLS;

            return {row: row, col: col};
        }

        function numNeighbours(index) {
            const {row, col} = indexToRowCol(index);

            const min_row = Math.max(row - 1, 0);
            const max_row = Math.min(row + 1, ROWS - 1);

            const min_col = Math.max(col - 1, 0);
            const max_col = Math.min(col + 1, COLS - 1);

            let neighbours = 0; // note: self will be included in this computation, account for later by subtracting 1
            for (let r = min_row; r <= max_row; r++) {
                for (let c = min_col; c <= max_col; c++) {

                    if (matrix[r * COLS + c].current) neighbours++;
                }    
            }

            return neighbours - matrix[index].current;
        }

        function run() {
            isRunning = true;

            for (let i = 0; i < ROWS * COLS; i++) {

                const neighbours = numNeighbours(i);

                if (matrix[i].current) {
                    // Any live cell with fewer than two live neighbours dies, as if by underpopulation.
                    if (neighbours < 2) matrix[i].next = 0;

                    // Any live cell with two or three live neighbours lives on to the next generation.
                    // default case

                    // Any live cell with more than three live neighbours dies, as if by overpopulation.
                    if (neighbours > 3) matrix[i].next = 0;
                }
                
                // Any dead cell with exactly three live neighbours becomes a live cell, as if by reproduction
                if (!matrix[i].next && neighbours === 3) matrix[i].next = 1;

            }


            // Apply changes
            for (let i = 0; i < ROWS * COLS; i++) {
                if (matrix[i].next !== null) matrix[i].current = matrix[i].next;
                matrix[i].next = null;

                if (matrix[i].current) cells[i].classList.add('alive'); else cells[i].classList.remove('alive');
            }

            setTimeout(() => {
                if (isRunning) run();
            }, speed[1]);

        }


    </script>
</body>
